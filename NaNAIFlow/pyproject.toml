[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-telegram-agent"
version = "0.1.0"
description = "Telegram-triggered Android Kotlin app generator driven by OpenCode CLI"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["android_agent_bot*"]
